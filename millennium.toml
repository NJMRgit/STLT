[plugin]
id = "steam-linux-transparency"
name = "Steam Linux Transparency"
version = "2.4.1"
author = "NJMRgit"
description = "Native per-pixel window transparency for Steam on Linux. Themes with transparent backgrounds can show the desktop."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[inspect]
depth = 4
colors = true
show_hidden = true
