[plugin]
id = "steam-linux-transparency"
name = "Steam Linux Transparency"
version = "3.0.0"
author = "NJMRgit"
description = "Native per-pixel window transparency for Steam on Linux, applied at runtime. No Steam files are patched."

[frontend]
entry = "frontend/index.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[inspect]
depth = 4
colors = true
show_hidden = true
